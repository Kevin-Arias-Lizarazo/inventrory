services:
  inventario:
    build: ./backend
    container_name: inventario
    ports:
      - "8080:8080"
    environment:
      INVENTARIO_DB: /data/inventario.db
      APP_UPLOADS_DIR: /data/uploads
      TZ: America/Bogota
    volumes:
      - inventario-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_HOST: http://inventario:8080
    depends_on:
      - inventario
    restart: unless-stopped

volumes:
  inventario-data: