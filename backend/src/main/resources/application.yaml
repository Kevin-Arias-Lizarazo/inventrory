spring:
  application:
    name: inventario
  datasource:
    url: jdbc:sqlite:${INVENTARIO_DB:inventario.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  uploads:
    dir: ${APP_UPLOADS_DIR:uploads}

server:
  port: 8080