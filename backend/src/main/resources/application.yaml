spring:
  application:
    name: inventario
  datasource:
    url: jdbc:sqlite:${INVENTARIO_DB:inventario.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  uploads:
    dir: ${APP_UPLOADS_DIR:uploads}
  sesiones:
    dir: ${APP_SESIONES_DIR:sesiones}
  logs:
    dir: ${APP_LOGS_DIR:logs}
  auth:
    secret:
      file: ${AUTH_SECRET_FILE:.env.auth}
  backups:
    dir: ${APP_BACKUPS_DIR:backups}

server:
  port: 8080