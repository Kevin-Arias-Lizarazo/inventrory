services:
  inventario:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: inventario
    ports:
      - "8080:8080"
    environment:
      INVENTARIO_DB: /data/inventario.db
      APP_UPLOADS_DIR: /data/uploads
      TZ: America/Bogota
    volumes:
      - inventario-data:/data
    restart: unless-stopped

volumes:
  inventario-data:
